apiVersion: v1
kind: Pod
metadata:
  name: bench-runner
  namespace: default
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: sagemaker.amazonaws.com/RestrictedNode
      operator: Exists
      effect: NoSchedule
  containers:
    - name: runner
      image: python:3.11-slim
      command:
        - /bin/bash
        - -c
        - |
          pip install aiohttp -q
          echo "bench-runner ready"
          sleep infinity
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: results
          mountPath: /results
      resources:
        requests:
          cpu: "2"
          memory: 2Gi
  volumes:
    - name: scripts
      configMap:
        name: benchmark-scripts
    - name: results
      emptyDir: {}
