# Checkov configuration file
# These checks are skipped with documented justification

skip-check:
  # CKV2_AWS_62: Event notifications not required for logging buckets
  # Logging buckets are internal infrastructure and don't need event monitoring
  - CKV2_AWS_62

  # CKV2_AWS_65: Logging buckets require BucketOwnerPreferred for S3 log delivery service
  # This is required for S3 server access logging to work properly
  - CKV2_AWS_65

  # CKV_AWS_144: Cross-region replication not required for logging/supporting buckets
  # Only the main bucket requires cross-region replication
  - CKV_AWS_144

  # CKV2_AWS_64: KMS key uses default policy which is secure
  # Explicit policy not required when using default AWS KMS policy
  - CKV2_AWS_64

  # CKV_TF_1: Using version tags instead of commit hashes for maintainability
  # Version-pinned modules from official Terraform registry are acceptable
  - CKV_TF_1

  # CKV_AWS_382: Egress to 0.0.0.0/0 is required for NAT gateway scenarios
  # Private subnets need outbound internet access via NAT
  - CKV_AWS_382

  # CKV_K8S_28: NET_RAW capability needed for vLLM container networking
  # GPU containers require certain networking capabilities
  - CKV_K8S_28

  # CKV_K8S_22: vLLM requires write access for model caching
  # Model files are downloaded and cached at runtime
  - CKV_K8S_22

  # CKV_K8S_25: SYS_PTRACE capability required for GPU profiling/debugging
  # Essential for NVIDIA GPU containers
  - CKV_K8S_25

  # CKV_K8S_15: Using specific version tags is acceptable
  # IfNotPresent allows caching while version tag ensures reproducibility
  - CKV_K8S_15

  # CKV_K8S_43: Using version tags instead of digests for maintainability
  # Version-pinned images are acceptable for development
  - CKV_K8S_43
