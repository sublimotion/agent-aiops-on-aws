catalog_id: coding-agent
use_case: coding-agent
description: Agentic coding with tool calls. Longer output, moderate concurrency.

dataset:
  type: synthetic
  input_tokens: {mean: 4096, std_dev: 1024}
  output_tokens: {mean: 2048, std_dev: 512}

load:
  type: constant
  request_rate: 4.0
  num_prompts: 100

slo:
  ttft_p99_ms: 500
  tpot_p99_ms: 30
  e2e_p99_ms: 60000
  error_rate_max: 0.001
