catalog_id: stress-saturation
use_case: stress
description: Find the breaking point. Multi-stage ramp to saturation.

dataset:
  type: synthetic
  input_tokens: {mean: 1024, std_dev: 0}
  output_tokens: {mean: 512, std_dev: 0}

load:
  type: staged
  stages:
    - {rate: 1, duration_s: 60}
    - {rate: 4, duration_s: 60}
    - {rate: 16, duration_s: 60}
    - {rate: 64, duration_s: 60}

slo:
  error_rate_max: 0.05
