---
# Service for prefill workers
apiVersion: v1
kind: Service
metadata:
  name: nemotron-prefill
  namespace: ml-inference
spec:
  selector:
    app: nemotron-super
    role: prefill
  ports:
    - port: 30000
      targetPort: 30000
      protocol: TCP
  type: ClusterIP
---
# Service for decode workers
apiVersion: v1
kind: Service
metadata:
  name: nemotron-decode
  namespace: ml-inference
spec:
  selector:
    app: nemotron-super
    role: decode
  ports:
    - port: 30000
      targetPort: 30000
      protocol: TCP
  type: ClusterIP
---
# NodePort service for external benchmark access (routes to decode workers for responses)
apiVersion: v1
kind: Service
metadata:
  name: nemotron-disagg-nodeport
  namespace: ml-inference
spec:
  selector:
    app: nemotron-super
    role: prefill
  ports:
    - port: 30000
      targetPort: 30000
      nodePort: 30089
      protocol: TCP
  type: NodePort
