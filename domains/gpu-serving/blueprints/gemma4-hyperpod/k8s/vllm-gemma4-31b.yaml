apiVersion: v1
kind: Pod
metadata:
  name: vllm-gemma4-31b
  namespace: default
  labels:
    app: vllm-gemma4-31b
    model: gemma-4-31b
spec:
  restartPolicy: Never
  nodeSelector:
    sagemaker.amazonaws.com/node-health-status: Schedulable
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: sagemaker.amazonaws.com/RestrictedNode
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: vllm/vllm-openai:latest
      command:
        - /bin/bash
        - -c
        - |
          apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
          pip install -q git+https://github.com/huggingface/transformers.git 2>&1 | tail -3
          vllm serve /models/gemma-4-31B-it \
            --tensor-parallel-size 2 \
            --dtype bfloat16 \
            --max-model-len 32768 \
            --gpu-memory-utilization 0.90 \
            --enable-prefix-caching \
            --tool-call-parser pythonic \
            --enable-auto-tool-choice \
            --host 0.0.0.0 \
            --port 8002 \
            --trust-remote-code
      ports:
        - containerPort: 8002
          name: http
          protocol: TCP
      env:
        - name: NCCL_DEBUG
          value: "WARN"
      resources:
        requests:
          cpu: "16"
          memory: 64Gi
          nvidia.com/gpu: "2"
        limits:
          nvidia.com/gpu: "2"
      readinessProbe:
        httpGet:
          path: /health
          port: 8002
        initialDelaySeconds: 120
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: 8002
        initialDelaySeconds: 300
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      volumeMounts:
        - name: model-store
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: model-store
      hostPath:
        path: /opt/dlami/nvme/models
        type: DirectoryOrCreate
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-gemma4-31b
  namespace: default
spec:
  type: NodePort
  selector:
    app: vllm-gemma4-31b
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30802
      protocol: TCP
