###############################################################################
# NLB Service for Ray Serve — targets worker proxies only (not head)
#
# The KubeRay-created yolo-ft-serve-svc is ClusterIP only and its selector
# includes the random cluster suffix, making it fragile across recreations.
# This NLB uses stable labels to route to worker-only serve proxies.
#
# With this in place, head pod failure causes zero downtime:
# NLB health checks detect the dead pod and route to worker proxies.
#
# Uses in-tree cloud provider NLB (no AWS LB Controller required).
###############################################################################
apiVersion: v1
kind: Service
metadata:
  name: yolo-ft-nlb
  namespace: ray-ft
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    ray.io/serve: "true"
    app.kubernetes.io/name: kuberay
    ray-node: worker
  ports:
    - name: serve
      port: 80
      targetPort: 8000
      protocol: TCP
