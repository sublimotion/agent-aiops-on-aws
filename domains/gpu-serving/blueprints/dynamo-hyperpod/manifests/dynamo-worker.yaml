# Dynamo vLLM worker — manual deployment (fallback if Dynamo Operator doesn't install on HyperPod)
# Deploys Qwen3-0.6B with KVBM tiered cache (G1 GPU → G2 CPU → G3 FSx)
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-frontend
  namespace: dynamo-validation
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: dynamo-worker
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-worker
  namespace: dynamo-validation
spec:
  clusterIP: None
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: dynamo-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-worker
  namespace: dynamo-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-worker
  template:
    metadata:
      labels:
        app: dynamo-worker
    spec:
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: gpu-workers
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Create FSx cache directory with writable permissions
        # (HyperPod FSx root is 755/root:root — lesson from llmd-hyperpod)
        - name: fsx-init
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /mnt/fsx/kv-cache && chmod 777 /mnt/fsx/kv-cache"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: fsx-cache
              mountPath: /mnt/fsx
      containers:
        - name: vllm
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--enable-prefix-caching"
            - "--gpu-memory-utilization=0.90"
            - "--max-model-len"
            - "8192"
          env:
            # --- KVBM G2: CPU DRAM cache ---
            - name: DYN_KVBM_CPU_CACHE_GB
              value: "8"
            # --- KVBM G3: FSx Lustre disk cache ---
            - name: DYN_KVBM_DISK_CACHE_DIR
              value: "/mnt/fsx/kv-cache/"
            - name: DYN_KVBM_DISK_CACHE_GB
              value: "50"
            - name: DYN_KVBM_DISK_ZEROFILL_FALLBACK
              value: "true"
            - name: DYN_KVBM_DISK_DISABLE_O_DIRECT
              value: "true"
            # --- etcd service discovery ---
            - name: DYNAMO_ETCD_ENDPOINTS
              value: "http://etcd.dynamo-validation.svc.cluster.local:2379"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: fsx-cache
              mountPath: /mnt/fsx
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: fsx-cache
          persistentVolumeClaim:
            claimName: fsx-dynamo
        - name: hf-cache
          emptyDir: {}
