# LMCache ConfigMap — GDS Backend (GPU Direct Storage → FSx)
# Winner from Phase 1 benchmarks — default for Phase 2
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-config-gds
  namespace: ml-inference
data:
  config.yaml: |
    chunk_size: 256
    local_cpu: false
    gds_path: "/mnt/fsx/kv-cache"
    cufile_buffer_size: 8192
