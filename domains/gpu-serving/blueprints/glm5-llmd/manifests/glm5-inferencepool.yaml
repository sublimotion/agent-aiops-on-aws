# Gateway API InferencePool — maps model to vLLM backend pods
# endpointPickerRef points to the llm-d EPP service for prefix-cache-aware routing
# Uses GA API (inference.networking.k8s.io/v1) — EPP v1.3.1 requires this group
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: glm5-pool
  namespace: ml-inference
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      app: vllm-glm5
  endpointPickerRef:
    name: glm5-epp
    port:
      number: 9002
