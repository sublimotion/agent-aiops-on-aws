# Gateway API HTTPRoute — routes /v1/* to GLM-5 InferencePool
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glm5-route
  namespace: ml-inference
spec:
  parentRefs:
    - name: llm-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - name: model
              value: glm5
      backendRefs:
        - group: inference.networking.x-k8s.io
          kind: InferencePool
          name: glm5-pool
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - group: inference.networking.x-k8s.io
          kind: InferencePool
          name: glm5-pool
          port: 8000
