---
# Field Note Schema v1
# Generated by compound-learner after benchmark session 2026-06-15/16.
# Run `scripts/fe.sh learn domains/gpu-serving/blueprints/fin-attribute-extraction/` to apply the learn commands.
# Run `scripts/fe.sh contribute domains/gpu-serving/blueprints/fin-attribute-extraction/` to open a community contribution PR.

model: "Qwen/Qwen3.6-35B-A3B"
engine: "vllm"
hardware: "g7e.12xlarge, p5en.48xlarge, p6-b200.48xlarge"  # spanned three GPU architectures
gpu_arch: "sm_120, sm_90, sm_100"  # g7e Blackwell, H200 Hopper, B200 Blackwell
deployment_date: "2026-06-16"

outcome: "success"  # benchmark completed on all three architectures; full 3-way comparison achieved
failure_categories: []  # no failures — pure benchmark session with measured bottleneck classes per arch

cards_used:
  mdc: []  # qwen3.6-35b card did not exist at benchmark time; lessons will seed the initial card
  gpu_infra: ["g7e", "p6-b200", "p5en"]  # consulted for NCCL/EFA requirements, sm_120 quirks

card_helped: null  # no pre-existing mdc card for qwen3.6-35b

benchmark:
  # Per-replica SLO-safe knee (E2E p90 ≤2s) across three architectures:
  # g7e (sm_120): ~12 RPS/replica, launch-bound (SM ~43%, no full graph capture)
  # H200 (sm_90): ~20 RPS/replica, compute-bound (SM ~100%, full graph capture works)
  # B200 (sm_100): ~22 RPS/replica, compute-bound (SM ~99%, full graph capture works)
  # Serving config: FP8 TP1, mnbt=8192, ISL ~2500, OSL ~22
  throughput_toks_s: 2374  # output tokens/sec at per-replica SLO-safe knee (varies by arch, H200 example ~20 RPS × ~22 OSL × ~5.4 output_tokens/s ≈ 2400; measured B200 @ c=22: 2374)
  ttft_p50_ms: 95  # unloaded TTFT p50 (consistent across all three archs: g7e 93ms, H200 91ms, B200 97ms)
  ttft_p99_ms: null  # not explicitly measured in unloaded case; loaded p90 at knee: g7e 1991ms, H200 1559ms, B200 1829ms
  concurrent_users: 22  # per-replica SLO-safe knee concurrency (B200, highest)
  gpu_util_pct: 99  # at SLO-safe knee on datacenter GPUs (H200/B200 SM ~99-100%); g7e only 43% (launch-bound)

ralph_iterations: null  # not a RALPH deployment — benchmark session only

# Ready-to-run commands — copy-paste or let `fe learn` run them automatically
mdc_learn_commands:
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "Qwen3.6-35B-A3B (qwen3_5_moe): hybrid Gated-DeltaNet MoE, 256 experts (8 routed), moe_intermediate_size=512, 40 layers, multimodal (vision encoder present). Serves on vLLM 0.22.1. No official FP8 — online --quantization fp8 (per-tensor) works, fits ~32 GB. FP8 ≈ 2× the SLO-safe per-replica rate of bf16 (admission-ceiling bound, not bandwidth)."'
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "Disable thinking per-request with chat_template_kwargs={\"enable_thinking\": False} — default-on thinking emits ~64 tokens that blow tight SLOs (1s target). A regression that re-enables thinking is the single biggest deployment risk for this workload."'
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "Vision-encoder CUTLASS ICE on H200/sm_90 and B200/sm_100 — vllm_flash_attn_wrapper → cute.compile crash during ViT profiling. Serve text-only with --limit-mm-per-prompt '\''{\"image\":0,\"video\":0}'\'' to skip ViT. g7e/sm_120 dodged via different ViT attention path."'
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "max_num_seqs default 1024 exceeds available Mamba cache blocks (754) for hybrid layers — CUDA-graph capture refuses to start. Set --max-num-seqs 256 (workload target concurrency is 50 anyway)."'
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "FP8 + --data-parallel-size 2 broken on vLLM 0.22.1 for this hybrid GDN MoE — AssertionError: 1 != <ISL> in all-reduce path. bf16 DP=2 works. Workaround: run independent TP1 replicas behind a router (no DP coordinator)."'
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "First-batch JIT brutal — fused_moe_kernel + GDN/causal-conv1d JIT on first unseen shape → 32s cold TTFT, then 93ms warm. Always run warmup pass before benchmarking; cold-start makes server look wedged."'
  - 'mdc learn Qwen/Qwen3.6-35B-A3B vllm "FP8 MoE TP-divisibility: moe_intermediate_size 512 → TP1/2/4 OK (512/TP % 128 == 0), TP8 forbidden (512/8=64). Moot — model fits TP1 with huge headroom; use TP1 replicas."'

gpu_infra_learn_commands:
  - 'gpu-infra learn -c inference "vLLM full-decode CUDA-graph capture (Capturing CUDA graphs (decode, FULL)) is sm-arch-specific for hybrid Gated-DeltaNet MoE. SUCCEEDS on H200 (sm_90) and B200 (sm_100), CRASHES on g7e (sm_120) with AssertionError: 1 != <ISL> on vLLM 0.22.1. The crash is the ~2× per-replica differentiator — g7e launch-bound (SM ~43%) while datacenter parts compute-bound (SM ~99-100%). MoE backend identical (TRITON on all three). Re-test graph-capture per arch before concluding bigger GPU won'\''t help."'
  - 'gpu-infra learn -c k8s "GPU spot nodegroups on qwen3-next-bench-eks-cluster (us-east-2) launch WITHOUT the node security group (only cluster SG sg-0abb08cf4d13be131). Missing node SG (sg-0bf5ad07fc6c29df1) → ALL pod networking silently broken (cross-node pod-to-pod, FSx mount, in-cluster DNS). Manifests as connection timeouts / DNS failures, not obvious SG error. Fix: attach node SG to instance primary ENI after launch. Applies to both B200 and H200 spot nodegroups."'
  - 'gpu-infra learn -c k8s "GPU nodes with no internet egress + FSx-Lustre CSI mount failure (mount.lustre: Can'\''t parse NID, Lustre kmod mismatch on AMI). Pattern: stage weights to FSx from CPU node (has egress + working CSI), serve over HTTP from CPU-node pod (python3 -m http.server), fetch to GPU node emptyDir over pod network with pure-Python downloader (no apt/curl/egress needed). Reference ClusterIP via service IP if in-cluster DNS is flaky. Validated on qwen3-next-bench cluster."'
---
