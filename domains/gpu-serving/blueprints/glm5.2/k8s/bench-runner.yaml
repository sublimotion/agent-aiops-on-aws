# Bench-runner for glm5.2. hostNetwork + dnsPolicy Default (kimi L4) → reaches the serving pod on
# localhost and can pip-install. Drives concurrency at the coding-agent + long-input-31k operating
# points. Cache-hit headline = Σ cached_input_tokens / Σ prompt_tokens (engine-agnostic, token fraction).
apiVersion: v1
kind: ConfigMap
metadata: {name: glm52-bench-scripts, namespace: default}
data:
  bench.py: |
    #!/usr/bin/env python3
    # Concurrency driver. BYTE-IDENTICAL shared prefix (RadixAttention/prefix-cache exact-match, kimi scar)
    # + unique suffix per request. Two modes: --mode coding-agent (12K sys prompt) | long-input (31K).
    import asyncio, aiohttp, time, json, argparse, random, string
    p = argparse.ArgumentParser()
    p.add_argument("--engine", required=True, choices=["sglang","vllm"])
    p.add_argument("--port", type=int, required=True)
    p.add_argument("--conc", type=int, required=True)
    p.add_argument("--total", type=int, default=200)
    p.add_argument("--mode", choices=["coding-agent","long-input","long-input-16k"], default="coding-agent")
    p.add_argument("--out", required=True)
    a = p.parse_args()
    # coding-agent: 12K cacheable system prompt + ~1K turn suffix, 2K out.
    # long-input: ~23K byte-identical shared prefix (~74% of 31K) + ~8K suffix, 1K out.
    # long-input-16k: kimi 16k peak-traffic tier — ~11.8K shared prefix (~74%) + ~4.2K suffix, 1K out.
    if a.mode == "coding-agent":
        PREFIX_TOK, SUFFIX_TOK, OUT_TOK = 12000, 1024, 2048
    elif a.mode == "long-input-16k":
        PREFIX_TOK, SUFFIX_TOK, OUT_TOK = 11840, 4160, 1024
    else:
        PREFIX_TOK, SUFFIX_TOK, OUT_TOK = 23250, 8154, 1024
    SHARED_PREFIX = ("You are a coding agent. " + ("context " * PREFIX_TOK))
    def suffix():
        rid = "".join(random.choices(string.ascii_lowercase, k=8))
        return f"\nRequest {rid}: " + " ".join(random.choices(["fix","refactor","explain","test","trace"], k=SUFFIX_TOK))
    async def one(s):
        prompt = SHARED_PREFIX + suffix()
        if a.engine == "sglang":
            url=f"http://localhost:{a.port}/generate"
            body={"text":prompt,"sampling_params":{"max_new_tokens":OUT_TOK,"temperature":0.0},"stream":True}
        else:
            url=f"http://localhost:{a.port}/v1/completions"
            body={"model":"GLM-5.2-FP8","prompt":prompt,"max_tokens":OUT_TOK,"temperature":0.0,"stream":True}
        t0=time.time(); ttft=None; comp=0; cached=0; pt=0; accept=None
        async with s.post(url,json=body,timeout=aiohttp.ClientTimeout(total=900)) as r:
            async for raw in r.content:
                line=raw.decode("utf-8","ignore").strip()
                if not line or not line.startswith("data:"): continue
                payload=line[5:].strip()
                if payload=="[DONE]": continue
                if ttft is None: ttft=time.time()-t0
                try: chunk=json.loads(payload)
                except: continue
                meta=chunk.get("meta_info") or {}; usage=chunk.get("usage") or {}
                if meta.get("completion_tokens"): comp=meta["completion_tokens"]
                elif usage.get("completion_tokens"): comp=usage["completion_tokens"]
                c=meta.get("cached_tokens") or (usage.get("prompt_tokens_details") or {}).get("cached_tokens")
                if c is not None: cached=c
                ptv=meta.get("prompt_tokens") or usage.get("prompt_tokens")
                if ptv: pt=ptv
                if meta.get("spec_accept_length") is not None: accept=meta["spec_accept_length"]
        dt=time.time()-t0
        if not comp: comp=OUT_TOK
        return {"dt":dt,"ttft":ttft,"comp":comp,"cached":cached or 0,"prompt":pt,"accept":accept}
    async def main():
        # limit=0 (unlimited): conc*2 caused spurious client-side conn failures at c384+ across
        # back-to-back sweep runs (server was healthy, num_retracted=0) — looked like an SLO error
        # wall but was a harness artifact. Concurrency is bounded by the semaphore, not the connector.
        conn=aiohttp.TCPConnector(limit=0)
        async with aiohttp.ClientSession(connector=conn) as s:
            sem=asyncio.Semaphore(a.conc)
            async def g():
                async with sem:
                    try: return await one(s)
                    except Exception as e: return {"err":str(e)}
            t0=time.time(); res=await asyncio.gather(*[g() for _ in range(a.total)]); t1=time.time()
        ok=[r for r in res if "err" not in r]
        comp=sum(r["comp"] for r in ok); cached=sum(r["cached"] for r in ok); pt=sum(r["prompt"] for r in ok)
        def pct(xs,q):
            xs=sorted(x for x in xs if x is not None)
            return round(xs[min(len(xs)-1,int(len(xs)*q))],3) if xs else None
        e2e=[r["dt"] for r in ok]; ttfts=[r["ttft"] for r in ok if r.get("ttft") is not None]
        accs=[r["accept"] for r in ok if r.get("accept")]
        out={"engine":a.engine,"mode":a.mode,"concurrency":a.conc,"requests_ok":len(ok),
             "requests_err":len(res)-len(ok),"duration_s":round(t1-t0,3),
             "agg_decode_tok_s":round(comp/(t1-t0),1) if t1>t0 else 0,
             "cache_hit_token_fraction":round(cached/pt,4) if pt else None,
             "ttft_p50_s":pct(ttfts,0.50),"ttft_p95_s":pct(ttfts,0.95),"ttft_p99_s":pct(ttfts,0.99),
             "e2e_p50_s":pct(e2e,0.50),"e2e_p99_s":pct(e2e,0.99),"t_start":t0,"t_end":t1}
        if accs: out["spec_accept_length_mean"]=round(sum(accs)/len(accs),3)
        json.dump(out,open(a.out,"w"),indent=2); print(json.dumps(out,indent=2))
    asyncio.run(main())
---
apiVersion: v1
kind: Pod
metadata: {name: bench-runner, namespace: default, labels: {app: bench-runner}}
spec:
  restartPolicy: Always
  hostNetwork: true
  dnsPolicy: Default
  nodeSelector: {blueprint: glm5.2}
  tolerations:
    - {key: ai-infra/b200, operator: Exists, effect: NoSchedule}
    - {key: ai-infra/b300, operator: Exists, effect: NoSchedule}
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
    - name: runner
      image: python:3.12-slim
      command: ["bash","-c","pip install -q aiohttp && while true; do sleep 3600; done"]
      volumeMounts:
        - {name: scripts, mountPath: /scripts}
        - {name: nvme, mountPath: /mnt/nvme, mountPropagation: HostToContainer}
      resources: {requests: {cpu: "4", memory: 4Gi}}
  volumes:
    - {name: scripts, configMap: {name: glm52-bench-scripts}}
    - {name: nvme, hostPath: {path: /mnt/nvme, type: Directory}}
