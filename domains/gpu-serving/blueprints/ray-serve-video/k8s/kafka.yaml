###############################################################################
# Minimal Kafka (KRaft mode) for POC — single broker, no Zookeeper
###############################################################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: ray-video
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: ray-video
spec:
  serviceName: kafka-broker
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        role: system
      containers:
        - name: kafka
          image: apache/kafka:3.7.2
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          env:
            # KRaft mode (no Zookeeper)
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-broker.ray-video.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: CLUSTER_ID
              value: "ray-video-kafka-poc-001"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kraft-combined-logs
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: ray-video
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
# Job to create the video-segments topic after broker is ready
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: ray-video
spec:
  backoffLimit: 5
  template:
    spec:
      nodeSelector:
        role: system
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: apache/kafka:3.7.2
          command:
            - bash
            - -c
            - |
              echo "Waiting for Kafka broker..."
              for i in $(seq 1 60); do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker.ray-video.svc.cluster.local:9092 --list 2>/dev/null && break
                echo "  attempt $i/60..."
                sleep 2
              done
              echo "Creating topic video-segments..."
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker.ray-video.svc.cluster.local:9092 \
                --create --topic video-segments \
                --partitions 1 --replication-factor 1 \
                --if-not-exists
              echo "Topics:"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker.ray-video.svc.cluster.local:9092 --list
