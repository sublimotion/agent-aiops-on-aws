apiVersion: v1
kind: Pod
metadata:
  name: sglang-kimi-k26-tp8-ep8
  namespace: default
  labels: {app: sglang-kimi-k26, phase: kimi-tp8-ep8}
spec:
  restartPolicy: Never
  nodeSelector: {blueprint: qwen3-235b-speculative}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  hostNetwork: true
  containers:
    - name: sglang
      image: lmsysorg/sglang:v0.5.10-cu130
      command:
        - bash
        - -c
        - |
          find /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins -name trtllmGen_bmm_export -exec rm -rf {} + 2>/dev/null || true
          exec python3 -m sglang.launch_server \
            --model-path /mnt/nvme/models/kimi-k26-fp8 \
            --served-model-name Kimi-K2.6 \
            --tp 8 \
            --expert-parallel-size 8 \
            --moe-a2a-backend deepep \
            --tool-call-parser kimi_k2 \
            --reasoning-parser kimi_k2 \
            --speculative-algorithm EAGLE3 \
            --speculative-num-steps 4 \
            --speculative-num-draft-tokens 4 \
            --speculative-eagle-topk 1 \
            --speculative-draft-model-path /mnt/nvme/models/kimi-k26-eagle3 \
            --speculative-draft-attention-backend trtllm_mha \
            --mem-fraction-static 0.85 \
            --enable-hierarchical-cache \
            --hicache-size 200 \
            --enable-metrics \
            --trust-remote-code \
            --host 0.0.0.0 --port 30000
      env:
        - {name: SGLANG_ENABLE_SPEC_V2, value: "1"}
        - {name: HF_HOME, value: /mnt/nvme/hf-cache}
      resources:
        requests: {nvidia.com/gpu: "8", cpu: "32", memory: 256Gi}
        limits: {nvidia.com/gpu: "8", cpu: "64", memory: 1800Gi}
      securityContext:
        capabilities: {add: ["IPC_LOCK"]}
      volumeMounts:
        - {name: nvme, mountPath: /mnt/nvme}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - {name: nvme, hostPath: {path: /mnt/nvme, type: Directory}}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
