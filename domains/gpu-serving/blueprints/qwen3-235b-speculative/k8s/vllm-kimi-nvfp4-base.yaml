apiVersion: v1
kind: Pod
metadata:
  name: vllm-kimi-nvfp4-base
  namespace: default
  labels: {app: vllm-kimi-k26-nvfp4, phase: kimi-nvfp4-base}
spec:
  restartPolicy: Never
  nodeSelector: {blueprint: qwen3-235b-speculative}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  hostNetwork: true
  containers:
    - name: vllm
      image: vllm/vllm-openai:latest
      command:
        - bash
        - -c
        - |
          exec python3 -m vllm.entrypoints.openai.api_server \
            --model /mnt/nvme/models/kimi-k26-nvfp4 \
            --served-model-name Kimi-K2.6-NVFP4 \
            --tensor-parallel-size 4 \
            --tool-call-parser kimi_k2 \
            --reasoning-parser kimi_k2 \
            --enable-auto-tool-choice \
            --max-model-len 65536 \
            --gpu-memory-utilization 0.92 \
            --enable-prefix-caching \
            --trust-remote-code \
            --host 0.0.0.0 --port 30000
      env:
        - {name: HF_HOME, value: /mnt/nvme/hf-cache}
        - {name: VLLM_USE_V1, value: "1"}
      resources:
        requests: {nvidia.com/gpu: "4", cpu: "32", memory: 256Gi}
        limits: {nvidia.com/gpu: "4", cpu: "64", memory: 512Gi}
      securityContext: {capabilities: {add: ["IPC_LOCK"]}}
      volumeMounts:
        - {name: nvme, mountPath: /mnt/nvme}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - {name: nvme, hostPath: {path: /mnt/nvme, type: Directory}}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
