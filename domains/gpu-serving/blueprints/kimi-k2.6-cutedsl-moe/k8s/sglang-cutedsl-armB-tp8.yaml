# ARM B (treatment) — FlashInfer CuTe-DSL NVFP4 MoE, TP8x1 (layout-independence control point).
# See sglang-cutedsl-armB-tp4dp2.yaml header for the DEPLOY-TIME GATE — the CuTe-DSL toggle and
# image are NOT yet pinned (SGLang #28354 DRAFT as of 2026-06-23). Confirm before running.
apiVersion: v1
kind: Pod
metadata:
  name: sglang-cutedsl-armB-tp8
  namespace: default
  labels: {app: sglang-cutedsl, arm: b-cutedsl, layout: tp8, backend: cute-dsl}
spec:
  restartPolicy: Never
  nodeSelector: {blueprint: kimi-k2.6-cutedsl-moe}
  tolerations:
    - {key: ai-infra/b200, operator: Exists, effect: NoSchedule}
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  hostNetwork: true
  containers:
    - name: sglang
      image: lmsysorg/sglang:v0.5.13.post1-cu130   # DEPLOY-TIME: repin to a build carrying #28354
      command:
        - bash
        - -c
        - |
          find /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins -name trtllmGen_bmm_export -exec rm -rf {} + 2>/dev/null || true
          exec python3 -m sglang.launch_server \
            --model-path /mnt/nvme/models/kimi-k26-nvfp4 \
            --served-model-name Kimi-K2.6-NVFP4 \
            --quantization modelopt_fp4 \
            --tp 8 \
            --tool-call-parser kimi_k2 \
            --reasoning-parser kimi_k2 \
            --context-length 65536 \
            --mem-fraction-static 0.90 \
            --enable-metrics \
            --trust-remote-code \
            --host 0.0.0.0 --port 30000
      env:
        - {name: HF_HOME, value: /mnt/nvme/hf-cache}
        - {name: SGLANG_NVFP4_MOE_BACKEND, value: "cute-dsl"}   # PLACEHOLDER — verify actual env/flag
      resources:
        requests: {nvidia.com/gpu: "8", cpu: "48", memory: 512Gi}
        limits:   {nvidia.com/gpu: "8", cpu: "96", memory: 1024Gi}
      securityContext: {capabilities: {add: ["IPC_LOCK"]}}
      volumeMounts:
        - {name: nvme, mountPath: /mnt/nvme, mountPropagation: HostToContainer}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - {name: nvme, hostPath: {path: /mnt/nvme, type: Directory}}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
