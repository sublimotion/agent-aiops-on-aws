apiVersion: v1
kind: Pod
metadata:
  name: sglang-deepseek-v4-flash
  namespace: default
  labels:
    app: sglang-deepseek-v4-flash
spec:
  restartPolicy: Never
  nodeSelector:
    node.kubernetes.io/instance-type: p6-b300.48xlarge
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  hostNetwork: true
  containers:
    - name: sglang
      # NOTE: SGLang DSv4 image not yet pinned by lmsys; use nightly. Watch SGLang #23602 (V4 roadmap).
      # Per #25662 OPEN precision regression — run quality smoke before trusting throughput.
      image: lmsysorg/sglang:latest
      command:
        - python3
        - -m
        - sglang.launch_server
        - --model-path
        - /mnt/nvme/models/DeepSeek-V4-Flash
        - --served-model-name
        - DeepSeek-V4-Flash
        - --tp-size
        - "8"
        - --context-length
        - "32768"
        - --mem-fraction-static
        - "0.90"
        - --trust-remote-code
        - --host
        - "0.0.0.0"
        - --port
        - "30000"
      env:
        - name: HF_HOME
          value: /mnt/nvme/hf-cache
        - name: HF_HUB_OFFLINE
          value: "1"
      resources:
        requests:
          nvidia.com/gpu: "8"
          cpu: "64"
          memory: 256Gi
        limits:
          nvidia.com/gpu: "8"
          cpu: "128"
          memory: 512Gi
      volumeMounts:
        - name: nvme
          mountPath: /mnt/nvme
        - name: shm
          mountPath: /dev/shm
      readinessProbe:
        httpGet:
          path: /health
          port: 30000
        initialDelaySeconds: 900   # ~15 min: DeepGEMM JIT can be slower on SGLang
        periodSeconds: 15
        failureThreshold: 80
  volumes:
    - name: nvme
      hostPath:
        path: /mnt/nvme
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 128Gi
