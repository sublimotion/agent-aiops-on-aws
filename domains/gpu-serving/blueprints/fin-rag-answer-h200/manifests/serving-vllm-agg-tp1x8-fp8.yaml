# vLLM serving on H200 (sm_90): Nemotron-3-Super FP8, agg-tp1-x8 (8 replicas x TP=1 = 8 H200 GPUs).
# Spec H1a — the H200 TP1-VIABLE hypothesis. FP8 weights (~124GB) FIT in a single H200's 141GB
# (unlike g7e's 96GB which FORCED TP>=2). 8 independent replicas, ZERO TP collectives —
# maximum replica count, no NCCL on the serving path at all. Test this FIRST per spec.
#
# VRAM at TP1: ~124GB weights + ~12GB KV/Mamba + ~3GB activations = ~139GB/GPU (tight but fits at 0.90).
# KV headroom is tighter than tp2-x4 — if OOM or KV-bound at conc 130, fall back to tp2-x4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-rag-h200-vllm-fp8-tp1
  namespace: ml-inference
  labels: {app: fin-rag-h200-vllm-tp1, precision: fp8, config: agg-tp1-x8, hw: h200-sm90}
spec:
  replicas: 8
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: fin-rag-h200-vllm-tp1, precision: fp8}
  template:
    metadata:
      labels: {app: fin-rag-h200-vllm-tp1, precision: fp8, config: agg-tp1-x8, hw: h200-sm90}
    spec:
      nodeSelector:
        fin-rag/hardware: h200-sm90
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: ai-infra/h200, operator: Exists, effect: NoSchedule}
      volumes:
        - name: nvme
          hostPath: {path: /mnt/nvme, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
      containers:
        - name: vllm
          image: 615299764834.dkr.ecr.us-east-2.amazonaws.com/vllm-openai:v0.22.1  # PRIMARY; fallback :v0.18.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - /mnt/nvme/models/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - --served-model-name
            - nemotron-3-super
            - --tensor-parallel-size
            - "1"
            - --trust-remote-code
            - --dtype
            - auto
            - --kv-cache-dtype
            - fp8
            - --gpu-memory-utilization
            - "0.92"
            - --max-model-len
            - "16384"
            - --enable-prefix-caching
            - --mamba-cache-mode
            - all
            - --enable-chunked-prefill
            - --max-num-batched-tokens
            - "16384"
            - --max-num-seqs
            - "256"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: VLLM_USE_V1, value: "1"}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 80
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "1"}
            limits: {nvidia.com/gpu: "1"}
          securityContext:
            capabilities: {add: ["IPC_LOCK"]}
          volumeMounts:
            - {name: nvme, mountPath: /mnt/nvme}
            - {name: shm, mountPath: /dev/shm}
---
apiVersion: v1
kind: Service
metadata:
  name: fin-rag-h200-vllm-fp8-tp1
  namespace: ml-inference
  labels: {app: fin-rag-h200-vllm-tp1, precision: fp8}
spec:
  type: ClusterIP
  selector: {app: fin-rag-h200-vllm-tp1, precision: fp8}
  ports:
    - {name: http, port: 8000, targetPort: 8000, protocol: TCP}
