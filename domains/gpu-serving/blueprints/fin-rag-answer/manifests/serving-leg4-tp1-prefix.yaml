# LEG 4 (P2, highest-value science): TP1 prefix-cache probe.
# ONE replica, TP=1, on a single B200 (183 GB). FP8 weights ~120G + KV + activations.
# THE QUESTION: prefix-cache hit rate is 0 at TP2 (vLLM #26201 "TP>1 not yet tested").
# Does it go >0 at TP1? If TP1 loads AND prefix cache engages on the ~3050-tok shared
# header (scrape vllm:gpu_prefix_cache_hit_rate / hits counter), that proves prefix caching
# only works at TP1 on this Mamba2 build. If it OOMs or hit rate stays 0, record that.
# Single replica → ClusterIP /metrics scrape is clean (one pod). gpu-mem-util raised to 0.92
# to give the single-GPU layout maximum room for weights+KV.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-rag-vllm-fp8
  namespace: ml-inference
  labels: {app: fin-rag-vllm, precision: fp8, config: leg4-tp1-prefix}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: fin-rag-vllm, precision: fp8}
  template:
    metadata:
      labels: {app: fin-rag-vllm, precision: fp8, config: leg4-tp1-prefix}
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: ai-infra/b200, operator: Exists, effect: NoSchedule}
      volumes:
        - name: nvme
          hostPath: {path: /mnt/nvme, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 32Gi}
      containers:
        - name: vllm
          image: 615299764834.dkr.ecr.us-east-2.amazonaws.com/vllm-openai:v0.18.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - /mnt/nvme/models/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - --served-model-name
            - nemotron-3-super
            - --tensor-parallel-size
            - "1"
            - --trust-remote-code
            - --dtype
            - auto
            - --kv-cache-dtype
            - fp8
            - --attention-backend
            - TRITON_ATTN
            - --gpu-memory-utilization
            - "0.92"
            - --max-model-len
            - "16384"
            - --enable-prefix-caching
            - --mamba-cache-mode
            - all
            - --enable-chunked-prefill
            - --max-num-batched-tokens
            - "16384"
            - --max-num-seqs
            - "256"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: VLLM_USE_V1, value: "1"}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 80
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests: {cpu: "12", memory: 64Gi, nvidia.com/gpu: "1"}
            limits: {nvidia.com/gpu: "1"}
          securityContext:
            capabilities: {add: ["IPC_LOCK"]}
          volumeMounts:
            - {name: nvme, mountPath: /mnt/nvme}
            - {name: shm, mountPath: /dev/shm}
---
apiVersion: v1
kind: Service
metadata:
  name: fin-rag-vllm-fp8
  namespace: ml-inference
  labels: {app: fin-rag-vllm, precision: fp8}
spec:
  type: ClusterIP
  selector: {app: fin-rag-vllm, precision: fp8}
  ports:
    - {name: http, port: 8000, targetPort: 8000, protocol: TCP}
