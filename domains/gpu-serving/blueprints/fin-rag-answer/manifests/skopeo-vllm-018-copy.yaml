# One-shot job: copy docker.io/vllm/vllm-openai:v0.18.1 -> ECR vllm-openai:v0.18.1
# Runs on a CPU system node; streams layers (no local mac pull, correct linux/amd64).
apiVersion: batch/v1
kind: Job
metadata:
  name: skopeo-vllm-018-copy
  namespace: ml-inference
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      containers:
        - name: skopeo
          image: quay.io/skopeo/stable:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Copying vllm/vllm-openai:v0.18.1 -> ECR ..."
              skopeo copy --retry-times 5 \
                --dest-creds "${ECR_USER}:${ECR_PW}" \
                docker://docker.io/vllm/vllm-openai:v0.18.1 \
                docker://615299764834.dkr.ecr.us-east-2.amazonaws.com/vllm-openai:v0.18.1
              echo "COPY_DONE"
          env:
            - name: ECR_USER
              valueFrom:
                secretKeyRef:
                  name: ecr-push-creds
                  key: username
            - name: ECR_PW
              valueFrom:
                secretKeyRef:
                  name: ecr-push-creds
                  key: password
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
