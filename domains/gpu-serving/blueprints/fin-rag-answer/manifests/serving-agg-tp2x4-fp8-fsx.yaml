# Serving: Nemotron-3-Super FP8, agg-tp2-x4 (4 replicas x TP=2 = all 8 B200). THE WINNER.
# FSx variant: reads weights directly from the host lustre mount at /mnt/fsx-manual
# (manual mount.lustre 10.0.44.21@tcp:/m2h5hbev — CSI can't parse the DNS-name NID).
# Identical image (v0.18.1) and args to serving-agg-tp2x4-fp8.yaml so knee-sweep points
# (c160/c192/c224) are comparable to the original c8/c32/c130 tp2x4 measurements.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-rag-vllm-fp8
  namespace: ml-inference
  labels: {app: fin-rag-vllm, precision: fp8, config: agg-tp2-x4}
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: fin-rag-vllm, precision: fp8}
  template:
    metadata:
      labels: {app: fin-rag-vllm, precision: fp8, config: agg-tp2-x4}
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: ai-infra/b200, operator: Exists, effect: NoSchedule}
      volumes:
        - name: fsx
          hostPath: {path: /mnt/fsx-manual, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 32Gi}
      containers:
        - name: vllm
          image: 615299764834.dkr.ecr.us-east-2.amazonaws.com/vllm-openai:v0.18.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model
            - /fsx/models/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
            - --served-model-name
            - nemotron-3-super
            - --tensor-parallel-size
            - "2"
            - --trust-remote-code
            - --dtype
            - auto
            - --kv-cache-dtype
            - fp8
            - --attention-backend
            - TRITON_ATTN
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "16384"
            - --enable-prefix-caching
            - --mamba-cache-mode
            - all
            - --enable-chunked-prefill
            - --max-num-batched-tokens
            - "16384"
            - --max-num-seqs
            - "256"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: VLLM_USE_V1, value: "1"}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 140      # FSx lustre load ~45s/shard x26 (~20min) + JIT; do NOT let liveness kill mid-load
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 1500   # > full FSx weight load + compile; liveness must not fire during cold start
            periodSeconds: 30
            failureThreshold: 20
          resources:
            requests: {cpu: "16", memory: 96Gi, nvidia.com/gpu: "2"}
            limits: {nvidia.com/gpu: "2"}
          securityContext:
            capabilities: {add: ["IPC_LOCK"]}
          volumeMounts:
            - {name: fsx, mountPath: /fsx, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
---
apiVersion: v1
kind: Service
metadata:
  name: fin-rag-vllm-fp8
  namespace: ml-inference
  labels: {app: fin-rag-vllm, precision: fp8}
spec:
  type: ClusterIP
  selector: {app: fin-rag-vllm, precision: fp8}
  ports:
    - {name: http, port: 8000, targetPort: 8000, protocol: TCP}
