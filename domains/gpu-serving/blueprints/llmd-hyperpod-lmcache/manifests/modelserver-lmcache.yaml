# Stage 4/5 model server — Qwen3-0.6B with LMCacheConnectorV1 wired to the HyperPod
# ai-toolkit managed L2 daemon (sagemaker-hyperpod://$(NODE_IP):9200).
#
# Same as modelserver-baseline.yaml plus: --kv-transfer-config, LMCACHE_* env,
# LMCACHE_CONFIG_FILE ConfigMap mount, hostPath /dev/shm (POSIX shm shared with the
# ai-toolkit daemon), PYTHONHASHSEED=0 (stable keys across restart).
#
# The dynamo image runs as uid 1000 — the SAME uid as the ai-toolkit daemon that
# created /dev/shm/ai_toolkit_cache (0600), so no chmod is needed. Carries the
# InferencePool selector label llm-d.ai/guide=tiered-prefix-cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-lmcache-decode
  namespace: llm-d-hp-lmcache
  labels:
    llm-d.ai/role: decode
    llm-d.ai/guide: tiered-prefix-cache
spec:
  replicas: 1
  strategy:
    type: Recreate          # clean L0/L1 wipe for the Stage 5 restart proof
  selector:
    matchLabels:
      llm-d.ai/role: decode
      llm-d.ai/guide: tiered-prefix-cache
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        llm-d.ai/guide: tiered-prefix-cache
    spec:
      dnsPolicy: Default
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: g6e-workers
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: modelserver
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--enable-prefix-caching"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.70"
            - "--kv-transfer-config"
            - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both","kv_connector_extra_config":{"sagemaker_hyperpod_shared_memory_name":"ai_toolkit_cache"}}'
          env:
            # NODE_IP must precede LMCACHE_REMOTE_URL for $(NODE_IP) substitution.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: LMCACHE_CONFIG_FILE
              value: "/etc/lmcache/config.yaml"
            - name: LMCACHE_USE_EXPERIMENTAL
              value: "True"
            - name: LMCACHE_LOCAL_CPU
              value: "True"
            - name: LMCACHE_MAX_LOCAL_CPU_SIZE
              value: "4"
            - name: LMCACHE_CHUNK_SIZE
              value: "256"
            - name: LMCACHE_REMOTE_URL
              value: "sagemaker-hyperpod://$(NODE_IP):9200"
            - name: PYTHONHASHSEED
              value: "0"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          ports:
            - containerPort: 8000
              name: modelserver
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            # Mount ONLY the daemon's segment FILE (type: File), NOT the whole
            # /dev/shm. With a Directory mount, LMCache's shm_unlink on pod
            # shutdown propagates to the host and DESTROYS the daemon-owned
            # segment; the daemon opens with create=False and can't recreate it,
            # so every later client goes unhealthy -> skips all stores. Bind-
            # mounting the single file isolates the client's unlink. (This is
            # what the dynamo run used; prerequisite: the daemon segment must
            # already exist, so restart the ai-toolkit DaemonSet pod first.)
            - name: hp-tiered-cache
              mountPath: /dev/shm/ai_toolkit_cache
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: lmcache-config
              mountPath: /etc/lmcache
              readOnly: true
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: hp-tiered-cache
          hostPath:
            path: /dev/shm/ai_toolkit_cache
            type: File
        - name: hf-cache
          emptyDir: {}
        - name: lmcache-config
          configMap:
            name: lmcache-config
