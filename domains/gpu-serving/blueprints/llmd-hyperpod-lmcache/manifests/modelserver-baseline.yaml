# Stage 3 baseline model server — Qwen3-0.6B, L0 only (no LMCache yet).
#
# Written as a plain Deployment rather than the upstream kustomize overlay because
# the upstream overlay hardwires Qwen3-32B / TP2 / H100 / vllm/vllm-openai (which
# lacks the SageMaker HyperPod LMCache adapter). We reuse the proven adapter-capable
# image from the dynamo run (already cached on this g6e node).
#
# The InferencePool selects pods by label llm-d.ai/guide=tiered-prefix-cache, so the
# decode pod MUST carry it for the router to route to it. targetPort 8000.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-hp-lmcache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmd-lmcache-decode
  namespace: llm-d-hp-lmcache
  labels:
    llm-d.ai/role: decode
    llm-d.ai/guide: tiered-prefix-cache
spec:
  replicas: 1
  strategy:
    type: Recreate          # clean L0/L1 wipe for the Stage 5 restart proof
  selector:
    matchLabels:
      llm-d.ai/role: decode
      llm-d.ai/guide: tiered-prefix-cache
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        llm-d.ai/guide: tiered-prefix-cache
    spec:
      dnsPolicy: Default     # resolve huggingface.co via node resolver (dynamo lesson)
      nodeSelector:
        sagemaker.amazonaws.com/instance-group-name: g6e-workers
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: modelserver
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--enable-prefix-caching"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.70"
          env:
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          ports:
            - containerPort: 8000
              name: modelserver
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "1500m"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: hf-cache
          emptyDir: {}
