# Seccomp profile that blocks io_uring_setup / io_uring_enter / io_uring_register.
#
# Why: CRIU 4.2 cannot dump processes with active io_uring rings.
# protocol/checkpoint.go:188-204 shows the upstream contract — when the
# operator's CheckpointJobOptions.SeccompProfile is set (default
# "profiles/block-iouring.json"), pod-level
# securityContext.seccompProfile.type=Localhost is injected with this profile.
# Localhost-type seccomp profiles must exist on disk on each node under
# /var/lib/kubelet/seccomp/<profile-path>.
#
# We deploy this as a ConfigMap and use a tiny installer DaemonSet
# (60-seccomp-installer-ds.yaml) — node-level files are not directly
# manageable from the API server.
#
# This file declares only the ConfigMap that holds the JSON profile content.
# The installer DaemonSet copies it onto each node's
# /var/lib/kubelet/seccomp/profiles/block-iouring.json on every node start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: block-iouring-seccomp
  namespace: dynamo-snapshot
  labels:
    app.kubernetes.io/component: snapshot-seccomp
data:
  block-iouring.json: |
    {
      "defaultAction": "SCMP_ACT_ALLOW",
      "syscalls": [
        {
          "names": [
            "io_uring_setup",
            "io_uring_enter",
            "io_uring_register"
          ],
          "action": "SCMP_ACT_ERRNO",
          "errnoRet": 1
        }
      ]
    }
---
# Installer DaemonSet — copies the profile from the ConfigMap onto every
# node's /var/lib/kubelet/seccomp/profiles/ directory and then sleeps. The
# kubelet expects localhost seccomp profiles to live on the node's filesystem,
# not in any API object. We re-run this on every pod start so a re-imaged
# node gets the profile before any workload pod with the seccomp pod-spec
# annotation is admitted. PodSecurityPolicy/PSA "privileged" namespace
# label allows this hostPath write.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-profile-installer
  namespace: dynamo-snapshot
  labels:
    app.kubernetes.io/component: snapshot-seccomp-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: snapshot-seccomp-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: snapshot-seccomp-installer
    spec:
      # Schedule only on snapshot-eligible GPU nodes — no profile needed elsewhere.
      nodeSelector:
        agent-aiops/snapshot-eligible: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      hostNetwork: false
      hostPID: false
      restartPolicy: Always
      initContainers:
        - name: install
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              mkdir -p /host/var/lib/kubelet/seccomp/profiles
              cp /seccomp-src/block-iouring.json /host/var/lib/kubelet/seccomp/profiles/block-iouring.json
              chmod 0644 /host/var/lib/kubelet/seccomp/profiles/block-iouring.json
              echo "installed block-iouring.json"
          volumeMounts:
            - name: host-seccomp-root
              mountPath: /host/var/lib/kubelet/seccomp
            - name: profile-src
              mountPath: /seccomp-src
          securityContext:
            privileged: true
      containers:
        - name: idle
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; while true; do sleep 3600 & wait $!; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      volumes:
        - name: host-seccomp-root
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
        - name: profile-src
          configMap:
            name: block-iouring-seccomp
