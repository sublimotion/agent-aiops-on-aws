# Ministral-3B serving Deployment.
#
# IMPORTANT — this is the source-of-truth pod TEMPLATE that the orchestrator
# (60-orchestrator-job.yaml) clones into a CheckpointJob spec, with these
# transforms applied at submit time:
#   - Pod label nvidia.com/snapshot-is-checkpoint-source=true added
#   - Pod label nvidia.com/snapshot-checkpoint-id=<uuid> added
#   - Annotation nvidia.com/snapshot-target-containers=ministral added (already here)
#   - Pod-level seccompProfile.type=Localhost,
#     localhostProfile=profiles/block-iouring.json injected (already here)
#   - Container "ministral" command rewritten by cuda-checkpoint --launch-job
#     (WrapLaunchJob=true in CheckpointJobOptions)
#   - readinessProbe replaced with exec [cat /snapshot-control/ready-for-checkpoint]
#     (per protocol/checkpoint.go:90-97)
#   - liveness/startupProbe cleared
#   - control volume snapshot-control (emptyDir, subPath=ministral) auto-injected
#     by EnsureControlVolume
#
# This Deployment runs in serving mode (replicas=1 initially in iter-5b B1).
# Its pod template is what the orchestrator deep-copies — we keep it as
# canonical here so dry-run validation catches schema drift early.
#
# The "ready-watcher" sidecar polls /v1/models and writes the
# ready-for-checkpoint sentinel once vLLM is warm. It runs in BOTH the
# serving Deployment (harmless — sentinel is only consumed by checkpoint Jobs)
# AND the cloned CheckpointJob template (essential — that's where the
# kubelet readiness probe gates dump start).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministral-3b
  namespace: dynamo-snapshot
  labels:
    app: ministral-3b
    app.kubernetes.io/component: ministral-3b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ministral-3b
  template:
    metadata:
      labels:
        app: ministral-3b
        app.kubernetes.io/component: ministral-3b
      annotations:
        # Required by the agent — exactly one container target per the
        # checkpoint protocol (protocol/checkpoint.go TargetContainersFromAnnotations(_,1,1)).
        nvidia.com/snapshot-target-containers: "ministral"
    spec:
      serviceAccountName: snapshot-orchestrator
      # Schedule on snapshot-eligible GPU nodes only.
      nodeSelector:
        agent-aiops/snapshot-eligible: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      restartPolicy: Always
      # Pod-level seccomp profile per upstream checkpoint contract. Localhost
      # type points at /var/lib/kubelet/seccomp/profiles/block-iouring.json
      # which the seccomp-profile-installer DaemonSet drops on every node.
      securityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/block-iouring.json
      # CRIU dumps require these caps inside the workload container so the
      # restore-side criu invocation can re-establish kernel state. The agent
      # nsenters from the host so the workload's caps don't gate the dump
      # itself, but the placeholder restore phase does need them.
      initContainers:
        # Stage Ministral-3B weights from S3 to the pod's emptyDir / NVMe-backed
        # local volume. AWS account 615299764834 ECR/S3 already authorized via
        # node IAM role.
        - name: weights-stage
          image: public.ecr.aws/aws-cli/aws-cli:2.17.32
          command:
            - /bin/sh
            - -c
            - |
              set -eux
              mkdir -p /weights/ministral-3b
              # Iter-5c: model is mistralai/Ministral-3-3B-Instruct-2512 staged
              # in HF-cache layout under models--mistralai--Ministral-3-3B-Instruct-2512/.
              # Sync the resolved snapshot (cfcb068...) directly into a flat dir
              # for vLLM's --load-format auto.
              aws s3 sync --no-progress \
                s3://vllm-model-cache-615299764834/models--mistralai--Ministral-3-3B-Instruct-2512/snapshots/cfcb068fa7c44114cf77a462357c6cdcd2c304b4/ \
                /weights/ministral-3b/
              echo "weights staged: $(du -sh /weights/ministral-3b)"
              ls -la /weights/ministral-3b/
          volumeMounts:
            - name: weights
              mountPath: /weights
      containers:
        - name: ministral
          image: vllm/vllm-openai:v0.10.2
          imagePullPolicy: IfNotPresent
          # Command — explicit, since cuda-checkpoint --launch-job wrapping in
          # the orchestrator prepends to this. Keep it as command (entrypoint
          # rewrite via wrapWithCudaCheckpointLaunchJob preserves command+args).
          command:
            - vllm
          args:
            - serve
            - /weights/ministral-3b
            - --served-model-name
            - ministral-3b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --tensor-parallel-size
            - "1"
            - --enable-sleep-mode
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.85"
            # Mistral tool-calling per workspace memory.
            - --tool-call-parser
            - mistral
            - --enable-auto-tool-choice
            - --load-format
            - mistral
            - --config-format
            - mistral
            - --tokenizer-mode
            - mistral
          env:
            - name: HF_HOME
              value: /weights/.hf
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            # Deterministic generation for Gate 1 token-ID equality.
            - name: VLLM_USE_V1
              value: "1"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          # Liveness/readiness during normal serving. The orchestrator
          # rewrites these on the cloned CheckpointJob template per
          # protocol/checkpoint.go (replaces readiness with the ready-for-checkpoint
          # sentinel exec probe, clears liveness/startup).
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "16Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "32Gi"
          securityContext:
            capabilities:
              add: ["SYS_PTRACE", "CHECKPOINT_RESTORE"]
          volumeMounts:
            - name: weights
              mountPath: /weights
            - name: shm
              mountPath: /dev/shm
            # Control volume — required by both checkpoint and restore protocol.
            # subPath equals the container name per EnsureControlVolume contract.
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: ministral
        - name: ready-watcher
          image: public.ecr.aws/docker/library/busybox:1.36
          # Polls vLLM /v1/models. Once the first 200 OK is observed, touches
          # /snapshot-control/ready-for-checkpoint inside the same emptyDir
          # subPath the workload container sees. Sleeps forever after.
          # On the cloned CheckpointJob, the kubelet's readinessProbe on the
          # ministral container then `cat`s this file and the agent observes
          # Ready=true → CRIU dump fires.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              CTRL=/snapshot-control
              SENT="$CTRL/ready-for-checkpoint"
              echo "[ready-watcher] polling http://localhost:8000/v1/models"
              while true; do
                if wget -q -O - http://localhost:8000/v1/models >/dev/null 2>&1; then
                  echo "[ready-watcher] first 200 OK — touching $SENT"
                  mkdir -p "$CTRL"
                  touch "$SENT"
                  break
                fi
                sleep 2
              done
              echo "[ready-watcher] sleeping forever (sentinel set)"
              while true; do sleep 3600; done
          volumeMounts:
            # Same emptyDir as the workload, same subPath — the sentinel the
            # watcher writes is the one the workload sees.
            - name: snapshot-control
              mountPath: /snapshot-control
              subPath: ministral
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: weights
          emptyDir:
            # Ministral-3B safetensors ~6 GiB.
            sizeLimit: 16Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: snapshot-control
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ministral-3b
  namespace: dynamo-snapshot
  labels:
    app: ministral-3b
spec:
  type: ClusterIP
  selector:
    app: ministral-3b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
